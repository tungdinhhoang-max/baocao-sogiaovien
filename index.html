<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Sổ giáo viên — MAPSTUDY Hạ Long</title>
<style>
:root{
  --nen:#F6F7F9; --tam:#FFFFFF; --vien:#E3E6EB; --vien2:#EDEFF3;
  --chu:#171A1F; --chu2:#4A5361; --mo:#8791A0;
  --nhan:#0E7C7B; --nhan-nhat:#E6F2F2; --nhan-dam:#0A5E5D;
  --xau:#C4453D; --xau-nen:#FDECEB;
  --vua:#B8770B; --vua-nen:#FDF4E3;
  --tot:#2E7D46; --tot-nen:#EAF5ED;
  --trong:#9AA3B0; --trong-nen:#F1F3F6;
  --bong:0 1px 2px rgba(16,24,40,.05);
  --bong2:0 4px 12px rgba(16,24,40,.08);
  --sb:246px;
}
@media(prefers-color-scheme:dark){:root{
  --nen:#12151A; --tam:#191D24; --vien:#2A303A; --vien2:#232830;
  --chu:#E9ECF1; --chu2:#B2BAC6; --mo:#7C8695;
  --nhan:#3BA9A7; --nhan-nhat:#12302F; --nhan-dam:#57C5C3;
  --xau:#E8776F; --xau-nen:#2E1C1B; --vua:#D9A441; --vua-nen:#2E2617;
  --tot:#5BB878; --tot-nen:#16291D; --trong:#6B7684; --trong-nen:#1F242C;
  --bong:0 1px 2px rgba(0,0,0,.3); --bong2:0 4px 12px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --nen:#12151A; --tam:#191D24; --vien:#2A303A; --vien2:#232830;
  --chu:#E9ECF1; --chu2:#B2BAC6; --mo:#7C8695;
  --nhan:#3BA9A7; --nhan-nhat:#12302F; --nhan-dam:#57C5C3;
  --xau:#E8776F; --xau-nen:#2E1C1B; --vua:#D9A441; --vua-nen:#2E2617;
  --tot:#5BB878; --tot-nen:#16291D; --trong:#6B7684; --trong-nen:#1F242C;
  --bong:0 1px 2px rgba(0,0,0,.3); --bong2:0 4px 12px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --nen:#F6F7F9; --tam:#FFFFFF; --vien:#E3E6EB; --vien2:#EDEFF3;
  --chu:#171A1F; --chu2:#4A5361; --mo:#8791A0;
  --nhan:#0E7C7B; --nhan-nhat:#E6F2F2; --nhan-dam:#0A5E5D;
  --xau:#C4453D; --xau-nen:#FDECEB; --vua:#B8770B; --vua-nen:#FDF4E3;
  --tot:#2E7D46; --tot-nen:#EAF5ED; --trong:#9AA3B0; --trong-nen:#F1F3F6;
  --bong:0 1px 2px rgba(16,24,40,.05); --bong2:0 4px 12px rgba(16,24,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--nen);color:var(--chu);
  font:14.5px/1.55 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;
}
.num{font-variant-numeric:tabular-nums;
     font-family:"SF Mono",Consolas,"Cascadia Mono",ui-monospace,monospace}

/* ===== THANH BÊN ===== */
aside{
  width:var(--sb);flex:0 0 var(--sb);background:var(--tam);
  border-right:1px solid var(--vien);height:100vh;position:sticky;top:0;
  display:flex;flex-direction:column;
}
.logo{padding:17px 18px 14px;border-bottom:1px solid var(--vien2)}
.logo b{display:block;font-size:14.5px;font-weight:640;letter-spacing:-.15px}
.logo span{font-size:11.5px;color:var(--mo)}
.dhuong{flex:1;overflow-y:auto;padding:10px 9px 16px}
.nhom{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--mo);
      padding:13px 9px 6px;font-weight:600;display:flex;align-items:center;gap:6px}
.nhom .n{margin-left:auto;background:var(--vien2);color:var(--mo);
         border-radius:9px;padding:0 6px;font-size:10px;letter-spacing:0}
.muc{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;
     cursor:pointer;font-size:13.5px;color:var(--chu2);border:none;background:none;
     width:100%;text-align:left;font-family:inherit;transition:background .12s}
.muc:hover{background:var(--vien2)}
.muc.on{background:var(--nhan-nhat);color:var(--nhan-dam);font-weight:600}
.muc .ic{width:16px;height:16px;flex:0 0 16px;opacity:.75}
.muc.on .ic{opacity:1}
.muc .p{margin-left:auto;font-size:11px;color:var(--mo)}
.muc.on .p{color:var(--nhan-dam)}
.cham{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.c-tot{background:var(--tot)} .c-vua{background:var(--vua)}
.c-xau{background:var(--xau)} .c-trong{background:var(--trong)}
.sb-chan{border-top:1px solid var(--vien2);padding:11px 16px;font-size:11px;color:var(--mo)}

/* ===== KHU CHÍNH ===== */
main{flex:1;min-width:0;overflow-x:hidden}
.dau{background:var(--tam);border-bottom:1px solid var(--vien);
     padding:15px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
     position:sticky;top:0;z-index:20}
.dau h1{font-size:18px;font-weight:640;letter-spacing:-.25px}
.dau .p{font-size:12.5px;color:var(--mo)}
.dau .phai{margin-left:auto;display:flex;gap:8px;align-items:center}
.nut{border:1px solid var(--vien);background:var(--tam);color:var(--chu2);
     border-radius:7px;padding:6px 12px;font-size:12.5px;cursor:pointer;
     font-family:inherit;transition:.12s}
.nut:hover{border-color:var(--mo);color:var(--chu)}
.nut.chinh{background:var(--nhan);border-color:var(--nhan);color:#fff}
.nut.chinh:hover{background:var(--nhan-dam)}
.than{padding:22px 26px 60px;max-width:1240px}

/* ===== dải số ===== */
.dai{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
     gap:12px;margin-bottom:22px}
.o{background:var(--tam);border:1px solid var(--vien);border-radius:10px;
   padding:13px 15px;box-shadow:var(--bong)}
.o .t{font-size:11.5px;color:var(--mo);font-weight:500;margin-bottom:5px}
.o .n{font-size:26px;font-weight:660;letter-spacing:-.7px;line-height:1.1}
.o .d{font-size:11.5px;color:var(--mo);margin-top:3px}
.o.c-do .n{color:var(--xau)} .o.c-vang .n{color:var(--vua)}

/* ===== khối việc cần làm ===== */
.viec{background:var(--tam);border:1px solid var(--vien);border-radius:11px;
      overflow:hidden;box-shadow:var(--bong);margin-bottom:22px}
.viec-dau{padding:13px 17px;border-bottom:1px solid var(--vien2);
          display:flex;align-items:center;gap:9px}
.viec-dau h2{font-size:14.5px;font-weight:640}
.viec-dau .dem{background:var(--xau-nen);color:var(--xau);font-size:11.5px;
               font-weight:640;border-radius:20px;padding:1px 9px}
.v{display:flex;gap:12px;padding:12px 17px;border-bottom:1px solid var(--vien2);
   align-items:flex-start}
.v:last-child{border-bottom:none}
.v-mau{width:3px;align-self:stretch;border-radius:3px;flex:0 0 3px;margin:1px 0}
.v-do{background:var(--xau)} .v-vang{background:var(--vua)} .v-xam{background:var(--trong)}
.v-noi{flex:1;min-width:0}
.v-tieu{font-size:13.5px;font-weight:600;margin-bottom:2px}
.v-mo{font-size:12.5px;color:var(--chu2)}
.v-mo b{color:var(--chu);font-weight:600}
.v-nhan{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.n-do{background:var(--xau-nen);color:var(--xau)}
.n-vang{background:var(--vua-nen);color:var(--vua)}
.n-xam{background:var(--trong-nen);color:var(--mo)}
.n-tot{background:var(--tot-nen);color:var(--tot)}

/* ===== bảng ===== */
.hop{background:var(--tam);border:1px solid var(--vien);border-radius:11px;
     overflow:hidden;box-shadow:var(--bong);margin-bottom:22px}
.hop-dau{padding:13px 17px;border-bottom:1px solid var(--vien2);
         display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.hop-dau h2{font-size:14.5px;font-weight:640}
.hop-dau .p{font-size:12.5px;color:var(--mo)}
.cuon{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 15px;font-size:10.5px;text-transform:uppercase;
   letter-spacing:.55px;color:var(--mo);font-weight:600;
   border-bottom:1px solid var(--vien2);white-space:nowrap;background:var(--tam)}
td{padding:9px 15px;border-bottom:1px solid var(--vien2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--vien2)}
th.p,td.p{text-align:right}
.ten-hs{font-weight:560}
.ms{color:var(--mo);font-size:11.5px}
.d{font-weight:650;font-size:13.5px}
.d.g{color:var(--tot)} .d.k{color:var(--chu)} .d.y{color:var(--xau)}
.trg{color:var(--mo);font-size:12px}
.thanh{width:74px;height:5px;background:var(--vien2);border-radius:3px;
       overflow:hidden;display:inline-block;vertical-align:middle}
.thanh i{display:block;height:100%;border-radius:3px}
.hang{width:23px;height:23px;border-radius:6px;display:inline-flex;
      align-items:center;justify-content:center;font-size:11.5px;font-weight:640;
      background:var(--vien2);color:var(--chu2)}
.hang.h1{background:#F5D77E;color:#5A4508} .hang.h2{background:#DDE1E7;color:#414A57}
.hang.h3{background:#E8C9A8;color:#5E4224}

/* ===== biểu đồ ===== */
.bd-hop{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
        gap:14px;margin-bottom:22px}
.bd{background:var(--tam);border:1px solid var(--vien);border-radius:11px;
    padding:15px 17px;box-shadow:var(--bong)}
.bd h3{font-size:12.5px;font-weight:640;margin-bottom:2px}
.bd .p{font-size:11.5px;color:var(--mo);margin-bottom:11px}
canvas{width:100%;display:block}

/* ===== trang học sinh ===== */
.lop-luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.the-lop{background:var(--tam);border:1px solid var(--vien);border-radius:10px;
     padding:13px 15px;cursor:pointer;box-shadow:var(--bong);transition:.13s;
     border-left:3px solid var(--trong)}
.the-lop:hover{box-shadow:var(--bong2);transform:translateY(-1px)}
.the-lop.t-tot{border-left-color:var(--tot)} .the-lop.t-vua{border-left-color:var(--vua)}
.the-lop.t-xau{border-left-color:var(--xau)}
.the-lop .tl{font-size:16px;font-weight:660;display:flex;align-items:baseline;gap:7px}
.the-lop .tl small{font-size:11px;color:var(--mo);font-weight:500}
.the-lop .gv{font-size:11.5px;color:var(--mo);margin-top:1px}
.the-lop .so{display:flex;gap:15px;margin-top:10px;font-size:12px}
.the-lop .so div{color:var(--mo)}
.the-lop .so b{color:var(--chu);font-weight:640;display:block;font-size:15px;
    font-variant-numeric:tabular-nums}
.rong{color:var(--mo);font-size:12.5px;padding:30px 17px;text-align:center}
.trong-nhan{display:inline-block;font-size:11px;color:var(--mo);
    background:var(--trong-nen);border-radius:5px;padding:2px 8px;margin-top:9px}

/* ===== hộp thoại học sinh ===== */
.man{position:fixed;inset:0;background:rgba(16,20,26,.45);z-index:90;
     display:none;align-items:flex-start;justify-content:center;padding:36px 18px;
     overflow-y:auto;backdrop-filter:blur(2px)}
.man.hien{display:flex}
.hs{background:var(--tam);border-radius:13px;max-width:700px;width:100%;
    box-shadow:0 16px 44px rgba(16,24,40,.24);overflow:hidden}
.hs-dau{padding:17px 21px;border-bottom:1px solid var(--vien2);display:flex;
        align-items:flex-start;gap:13px}
.hs-dau h2{font-size:17px;font-weight:660;letter-spacing:-.2px}
.hs-dau .p{font-size:12.5px;color:var(--mo);margin-top:2px}
.x{margin-left:auto;background:none;border:none;font-size:20px;color:var(--mo);
   cursor:pointer;line-height:1;padding:2px 5px;border-radius:5px}
.x:hover{background:var(--vien2);color:var(--chu)}
.hs-than{padding:17px 21px 21px}
.hs-o{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
      gap:10px;margin-bottom:17px}
.hs-o>div{background:var(--nen);border:1px solid var(--vien2);border-radius:9px;padding:10px 12px}
.hs-o .t{font-size:11px;color:var(--mo);margin-bottom:2px}
.hs-o .n{font-size:18px;font-weight:660;font-variant-numeric:tabular-nums}
.muc-hs{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mo);
        font-weight:600;margin:15px 0 8px}
.dong-tt{display:flex;justify-content:space-between;padding:7px 0;
         border-bottom:1px solid var(--vien2);font-size:13px}
.dong-tt:last-child{border-bottom:none}
.dong-tt span{color:var(--mo)} .dong-tt b{font-weight:560}
.trich{background:var(--nen);border-left:3px solid var(--nhan);border-radius:0 8px 8px 0;
       padding:10px 13px;font-size:13px;color:var(--chu2);line-height:1.6}

@media(max-width:860px){
  body{flex-direction:column}
  aside{width:100%;height:auto;position:static;flex:none;border-right:none;
        border-bottom:1px solid var(--vien)}
  .dhuong{max-height:186px;padding:8px}
  .nhom{padding-top:8px}
  .than{padding:16px 14px 44px} .dau{padding:12px 14px}
  .o .n{font-size:22px}
}
</style>
</head>
<body>

  <div class="logo"><b>Sổ giáo viên</b><span>MAPSTUDY Hạ Long</span></div>
  <nav class="dhuong" id="dhuong"></nav>

/* ---------- việc cần làm: dựng từ dữ liệu thật ---------- */
function dungViec(){
  const v=[];
  // 1. học sinh điểm thấp
  HS.filter(h=>dMoi(h)!=null&&dMoi(h)<5)
    .sort((a,b)=>dMoi(a)-dMoi(b)).forEach(h=>{
    v.push({mau:'do',nhan:'Gọi phụ huynh',nhanCls:'n-do',
      tieu:h.ten+' · '+h.lop,
      mo:`Thi khảo sát <b>${f2(dMoi(h))}</b> — dưới trung bình`+
         (h.sdt?` · ${h.sdt}`:' · <b>chưa có số điện thoại</b>'), hs:h.ms});
  });
  // 2. lớp chưa kê ngày học
  const chuaNgay = LOP.filter(l=>l.so_ngay_ke===0);
  if(chuaNgay.length) v.push({mau:'do',nhan:'Chặn điểm danh',nhanCls:'n-do',
    tieu:'Lớp '+chuaNgay.map(l=>l.lop).join(' · ')+' chưa có lịch học tháng 9',
    mo:'Quản sinh không điểm danh được cho tới khi điền ngày học'});
  // 3. thiếu SĐT
  const tSdt = LOP.filter(l=>l.thieu_sdt>0).sort((a,b)=>b.thieu_sdt-a.thieu_sdt);
  const tong = tSdt.reduce((a,b)=>a+b.thieu_sdt,0);
  if(tong) v.push({mau:'vang',nhan:tong+' em',nhanCls:'n-vang',
    tieu:'Thiếu số điện thoại phụ huynh',
    mo:'Nhiều nhất '+tSdt.slice(0,3).map(l=>`<b>${l.lop}</b> (${l.thieu_sdt})`).join(' · ')+
       ' — không gọi được khi có việc'});
  // 4. chưa điểm danh
  const cdd = LOP.filter(l=>l.so_buoi_chot===0&&l.so_ngay_ke>0);
  if(cdd.length) v.push({mau:'vang',nhan:cdd.length+' lớp',nhanCls:'n-vang',
    tieu:'Chưa chốt buổi điểm danh nào trong tháng 9',
    mo:'Sau mỗi buổi, quản sinh điền chữ <b>v</b> vào dòng "Đã điểm danh"'});
  // 5. lớp ở trường
  const tlt = LOP.reduce((a,b)=>a+b.thieu_lop_truong,0);
  if(tlt) v.push({mau:'vang',nhan:'257 em',nhanCls:'n-vang',
    tieu:'Chưa em nào có lớp ở trường',
    mo:'Cần để phân biệt hai em cùng tên <b>Phạm Minh Anh</b> ở lớp 12D'});
  // 6. chưa thi
  const ct = LOP.filter(l=>l.so_co_diem>0&&l.siso>l.so_co_diem);
  ct.forEach(l=>v.push({mau:'xam',nhan:(l.siso-l.so_co_diem)+' em',nhanCls:'n-xam',
    tieu:'Lớp '+l.lop+' còn em chưa thi khảo sát',
    mo:`${l.so_co_diem}/${l.siso} em đã có điểm — số còn lại cần thi bù`,lop:l.lop}));
  // 7. lớp khác chưa nộp
  const gv=[...new Set(KHAC.map(l=>l.gv).filter(Boolean))];
  v.push({mau:'xam',nhan:KHAC.length+' lớp',nhanCls:'n-xam',
    tieu:'Các môn khác chưa nộp dữ liệu',
    mo:gv.map(g=>`<b>${esc(g)}</b>`).join(' · ')+' — sổ chưa hiện được số liệu'});
  return v;
}

/* ---------- biểu đồ Canvas ---------- */
function veCot(cv,nhan,giatri,mauF){
  const dpr=devicePixelRatio||1, W=cv.clientWidth, H=150;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+'px';
  const x=cv.getContext('2d'); x.scale(dpr,dpr); x.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement);
  const cMo=cs.getPropertyValue('--mo').trim(), cVien=cs.getPropertyValue('--vien2').trim();
  const L=30,R=8,T=12,B=26, w=W-L-R, h=H-T-B;
  const max=10;
  x.strokeStyle=cVien; x.lineWidth=1; x.font='10px system-ui'; x.fillStyle=cMo;
  for(let i=0;i<=2;i++){
    const y=T+h-(h*i/2);
    x.beginPath(); x.moveTo(L,y+.5); x.lineTo(W-R,y+.5); x.stroke();
    x.textAlign='right'; x.fillText((max*i/2).toFixed(0),L-6,y+3);
  }
  const n=giatri.length, bw=Math.min(38,w/n*.62), gap=w/n;
  giatri.forEach((v,i)=>{
    const cx=L+gap*i+gap/2;
    if(v!=null){
      const bh=h*v/max;
      x.fillStyle=mauF(v);
      const r=3,bx=cx-bw/2,by=T+h-bh;
      x.beginPath(); x.moveTo(bx,by+bh); x.lineTo(bx,by+r);
      x.quadraticCurveTo(bx,by,bx+r,by); x.lineTo(bx+bw-r,by);
      x.quadraticCurveTo(bx+bw,by,bx+bw,by+r); x.lineTo(bx+bw,by+bh); x.closePath(); x.fill();
      x.fillStyle=cMo; x.font='600 10px system-ui'; x.textAlign='center';
      x.fillText(v.toFixed(2).replace('.',','),cx,by-4);
    }else{
      x.fillStyle=cVien; x.fillRect(cx-bw/2,T+h-4,bw,4);
    }
    x.fillStyle=cMo; x.font='11px system-ui'; x.textAlign='center';
    x.fillText(nhan[i],cx,H-8);
  });
}
function vePhanBo(cv,ds){
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=150;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
  const x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement);
  const cMo=cs.getPropertyValue('--mo').trim(),cVien=cs.getPropertyValue('--vien2').trim();
  const mucs=[['<5','y'],['5–6,5','v'],['6,5–8','k'],['≥8','g']];
  const dem=[0,0,0,0];
  ds.forEach(d=>{ if(d==null)return;
    dem[d<5?0:d<6.5?1:d<8?2:3]++; });
  const mx=Math.max(...dem,1);
  const L=8,R=8,T=12,B=26,w=W-L-R,h=H-T-B,gap=w/4;
  const mau={y:cs.getPropertyValue('--xau').trim(),v:cs.getPropertyValue('--vua').trim(),
             k:cs.getPropertyValue('--nhan').trim(),g:cs.getPropertyValue('--tot').trim()};
  dem.forEach((v,i)=>{
    const cx=L+gap*i+gap/2,bw=Math.min(50,gap*.6),bh=h*v/mx;
    if(v){
      x.fillStyle=mau[mucs[i][1]];
      const r=3,bx=cx-bw/2,by=T+h-bh;
      x.beginPath();x.moveTo(bx,by+bh);x.lineTo(bx,by+r);
      x.quadraticCurveTo(bx,by,bx+r,by);x.lineTo(bx+bw-r,by);
      x.quadraticCurveTo(bx+bw,by,bx+bw,by+r);x.lineTo(bx+bw,by+bh);x.closePath();x.fill();
      x.fillStyle=cMo;x.font='600 11px system-ui';x.textAlign='center';
      x.fillText(v,cx,by-4);
    }else{ x.fillStyle=cVien;x.fillRect(cx-bw/2,T+h-3,bw,3); }
    x.fillStyle=cMo;x.font='11px system-ui';x.textAlign='center';
    x.fillText(mucs[i][0],cx,H-8);
  });
}

/* ---------- biểu đồ điểm của một học sinh ---------- */
function veDiemHS(cv,ky,giatri,tbLop){
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=182;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
  const x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement);
  const cMo=cs.getPropertyValue('--mo').trim(),cVien=cs.getPropertyValue('--vien2').trim();
  const cTot=cs.getPropertyValue('--tot').trim(),cVua=cs.getPropertyValue('--vua').trim();
  const cXau=cs.getPropertyValue('--xau').trim(),cNhan=cs.getPropertyValue('--nhan').trim();
  const L=32,R=12,T=22,B=32,w=W-L-R,h=H-T-B,max=10;
  // lưới ngang
  x.font='10px system-ui';x.textAlign='right';
  for(let i=0;i<=5;i++){
    const y=T+h-(h*i/5);
    x.strokeStyle=i===0?cMo:cVien;x.lineWidth=1;
    x.beginPath();x.moveTo(L,y+.5);x.lineTo(W-R,y+.5);x.stroke();
    if(i%1===0){x.fillStyle=cMo;x.fillText((max*i/5).toFixed(0),L-7,y+3);}
  }
  const n=giatri.length,gap=w/n,bw=Math.min(54,gap*.5);
  // đường trung bình lớp — vẽ TRƯỚC, nhãn đặt sát mép trái để không đè nhãn cột
  if(tbLop!=null){
    const y=T+h-h*tbLop/max;
    x.strokeStyle=cNhan;x.lineWidth=1.5;x.setLineDash([5,4]);
    x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();x.setLineDash([]);
    const nh='TB lớp '+tbLop.toFixed(2).replace('.',',');
    x.font='600 9.5px system-ui';x.textAlign='left';
    const wn=x.measureText(nh).width;
    x.fillStyle=cs.getPropertyValue('--tam').trim();      // nền để chữ không dính đường
    x.fillRect(L+2,y-11,wn+6,12);
    x.fillStyle=cNhan;x.fillText(nh,L+5,y-2);
  }
  // đường nối các cột (thấy xu hướng)
  const diem=giatri.map((v,i)=>v==null?null:[L+gap*i+gap/2,T+h-h*v/max]);
  const co=diem.filter(Boolean);
  if(co.length>1){
    x.strokeStyle=cMo;x.lineWidth=1.5;x.globalAlpha=.4;
    x.beginPath();co.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));
    x.stroke();x.globalAlpha=1;
  }
  giatri.forEach((v,i)=>{
    const cx=L+gap*i+gap/2;
    if(v!=null){
      const bh=h*v/max,by=T+h-bh,bx=cx-bw/2;
      x.fillStyle=v>=8?cTot:v>=6.5?cNhan:v>=5?cVua:cXau;
      const r=4;
      x.beginPath();x.moveTo(bx,by+bh);x.lineTo(bx,by+r);
      x.quadraticCurveTo(bx,by,bx+r,by);x.lineTo(bx+bw-r,by);
      x.quadraticCurveTo(bx+bw,by,bx+bw,by+r);x.lineTo(bx+bw,by+bh);x.closePath();x.fill();
      // số trên đầu cột
      x.font='700 12px system-ui';x.textAlign='center';
      x.fillText(v.toFixed(2).replace('.',','),cx,by-6);
      // mũi tên so với kỳ trước — nền trắng để không bị đường TB lớp đè
      const tr=giatri.slice(0,i).filter(z=>z!=null).pop();
      if(tr!=null){
        const ch=v-tr;
        const nh=(ch>0?'▲ +':ch<0?'▼ ':'')+
          (ch===0?'không đổi':Math.abs(ch).toFixed(2).replace('.',','));
        x.font='600 9.5px system-ui';
        const wn=x.measureText(nh).width;
        x.fillStyle=cs.getPropertyValue('--tam').trim();
        x.fillRect(cx-wn/2-3,by-28,wn+6,12);
        x.fillStyle=ch>0?cTot:ch<0?cXau:cMo;
        x.fillText(nh,cx,by-19);
      }
    }else{
      x.fillStyle=cVien;x.fillRect(cx-bw/2,T+h-3,bw,3);
      x.fillStyle=cMo;x.font='10px system-ui';x.textAlign='center';
      x.fillText('chưa thi',cx,T+h-9);
    }
    x.fillStyle=cMo;x.font='11px system-ui';x.textAlign='center';
    x.fillText(ky[i],cx,H-11);
  });
}

/* ---------- hộp thoại học sinh ---------- */
function moHS(ms){
  const s=HS.find(x=>x.ms===ms); if(!s)return;
  const cung=HS.filter(x=>x.lop===s.lop);
  const kyL=kyLop(s.lop);
  const ds=cung.filter(x=>x.diem[kyL]!=null)
             .sort((a,b)=>b.diem[kyL]-a.diem[kyL]);
  const hang=ds.findIndex(x=>x.ms===ms)+1;
  const kyDs=[...new Set(cung.flatMap(x=>Object.keys(x.diem)))].sort();
  const d8=s.diem[kyL];
  const kyTr=kyDs[kyDs.indexOf(kyL)-1];
  const d7=kyTr?s.diem[kyTr]:undefined;
  // các kỳ đã có điểm trong TOÀN LỚP -> trục ngang cố định, em chưa thi vẫn thấy cột trống
  const ky=[...new Set(cung.flatMap(x=>Object.keys(x.diem)))].sort();
  const gt=ky.map(k=>s.diem[k]??null);
  const dl=ds.map(x=>x.diem[kyL]);
  const tbLop=dl.length?dl.reduce((a,b)=>a+b,0)/dl.length:null;
  const chenh=(d8!=null&&d7!=null)?d8-d7:null;
  const soTop=hang?Math.round(hang/ds.length*100):null;

  let h=`<div class="hs-dau"><div><h2>${esc(s.ten)}</h2>
      <div class="p">${s.ms} · Lớp ${s.lop} · ${esc(s.truong||'chưa rõ trường')}${
        s.lop_truong?' · '+esc(s.lop_truong):''}</div></div>
      <button class="x" onclick="dongHS()">×</button></div><div class="hs-than">
    <div class="hs-o">
      <div><div class="t">Điểm ${(TEN_KY[kyL]||'mới nhất').toLowerCase()}</div><div class="n" style="color:${
        d8==null?'var(--mo)':d8>=8?'var(--tot)':d8>=5?'var(--chu)':'var(--xau)'}">${
        d8!=null?f2(d8):'chưa thi'}</div></div>
      <div><div class="t">Hạng trong lớp</div><div class="n">${
        hang?hang+'<span style="font-size:12px;color:var(--mo)">/'+ds.length+'</span>':'—'}</div>
        ${soTop!=null?`<div class="t" style="margin:2px 0 0">top ${soTop}%</div>`:''}</div>
      <div><div class="t">So kỳ trước</div><div class="n" style="color:${
        chenh==null?'var(--mo)':chenh>0?'var(--tot)':chenh<0?'var(--xau)':'var(--chu)'}">${
        chenh==null?'—':(chenh>0?'+':'')+f2(chenh)}</div></div>
      <div><div class="t">Chuyên cần</div><div class="n">${
        s.chuyencan?s.chuyencan.di+'<span style="font-size:12px;color:var(--mo)">/'+
        s.chuyencan.tong+'</span>':'—'}</div></div>
    </div>`;

  // biểu đồ điểm
  if(ky.length){
    h+=`<div class="muc-hs">Các đầu điểm</div>
      <div class="bd" style="padding:13px 15px 8px;margin-bottom:4px">
      <canvas id="c-hs"></canvas></div>`;
    if(chenh!=null){
      const nx=chenh>=1?'tiến bộ rõ rệt':chenh>0?'có tiến bộ':
               chenh===0?'giữ nguyên phong độ':chenh>=-1?'giảm nhẹ':'giảm nhiều';
      h+=`<div class="trich" style="border-left-color:${
        chenh>0?'var(--tot)':chenh<0?'var(--xau)':'var(--nhan)'};margin-top:9px">
        Từ ${TEN_KY[ky[ky.length-2]]||ky[ky.length-2]} đến ${TEN_KY[ky[ky.length-1]]||''}:
        <b>${nx}</b> — ${chenh>0?'tăng':chenh<0?'giảm':'chênh'} ${f2(Math.abs(chenh))} điểm.
        ${tbLop!=null&&d8!=null?(d8>=tbLop?'Đang trên mức trung bình lớp.'
          :'Đang dưới mức trung bình lớp — cần theo sát.'):''}</div>`;
    }
  }else{
    h+=`<div class="muc-hs">Các đầu điểm</div>
        <div class="trich">Em chưa có điểm thi nào được ghi nhận.</div>`;
  }

  h+=`<div class="muc-hs">Thông tin</div>`;
  const tt=[['Trường',s.truong||'chưa có'],['Lớp ở trường',s.lop_truong||'chưa có'],
    ['Ngày nhập học',s.ngayvao||'chưa rõ'],
    ['Phụ huynh',s.phhs||'chưa có'],['Số điện thoại',s.sdt||'chưa có']];
  if(s.chuyen) tt.push(['Chuyển lớp',s.chuyen+(s.ngay_ch?' · '+s.ngay_ch:'')]);
  tt.forEach(([k,v])=>{ h+=`<div class="dong-tt"><span>${k}</span><b>${esc(v)}</b></div>`; });
  if(s.nhanxet){ h+=`<div class="muc-hs">Nhận xét của giáo viên</div>
    <div class="trich">${esc(s.nhanxet)}</div>`; }
  if(!s.sdt){ h+=`<div class="muc-hs">Cần bổ sung</div>
    <div class="trich" style="border-left-color:var(--xau)">Chưa có số điện thoại phụ huynh —
    không liên hệ được khi cần trao đổi về em.</div>`; }
  h+='</div>';
  document.getElementById('hs-noi').innerHTML=h;
  document.getElementById('man').classList.add('hien');
  document.body.style.overflow='hidden';
  if(ky.length) requestAnimationFrame(()=>{
    const cv=document.getElementById('c-hs');
    if(cv) veDiemHS(cv,ky.map(k=>TEN_KY[k]||k),gt,tbLop);
  });
}
function dongHS(){
  document.getElementById('man').classList.remove('hien');
  document.body.style.overflow='';
}
addEventListener('keydown',e=>{ if(e.key==='Escape')dongHS(); });

/* ---------- điều hướng ---------- */
function dungDieuHuong(){
  let h=`<div class="nhom">Tổng quan</div>
    <button class="muc" data-t="tong" onclick="moTrang('tong')">
      <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="1.8" y="1.8" width="5" height="5" rx="1"/><rect x="9.2" y="1.8" width="5" height="5" rx="1"/>
        <rect x="1.8" y="9.2" width="5" height="5" rx="1"/><rect x="9.2" y="9.2" width="5" height="5" rx="1"/></svg>
      Bảng tổng quan</button>`;
  h+=`<div class="nhom">Lớp tôi phụ trách<span class="n">${LOP.length}</span></div>`;
  LOP.forEach(l=>{
    const c=l.tb_thi==null?'c-trong':l.tb_thi>=7?'c-tot':l.tb_thi>=5.5?'c-vua':'c-xau';
    h+=`<button class="muc" data-t="lop:${l.lop}" onclick="moTrang('lop:${l.lop}')">
      <span class="cham ${c}"></span>Lớp ${l.lop}<span class="p num">${l.siso}</span></button>`;
  });
  h+=`<div class="nhom">Toàn trung tâm<span class="n">${KHAC.length}</span></div>
    <button class="muc" data-t="khac" onclick="moTrang('khac')">
      <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M2 5.5 8 2.5l6 3-6 3z"/><path d="M4.5 7.5v3.2c0 .6 1.6 1.6 3.5 1.6s3.5-1 3.5-1.6V7.5"/></svg>
      Các môn khác<span class="p">${KHAC.length}</span></button>`;
  document.getElementById('dhuong').innerHTML=h;
}
function moTrang(t){
  trangHT=t;
  document.querySelectorAll('.muc').forEach(e=>e.classList.toggle('on',e.dataset.t===t));
  if(t==='tong')veTongQuan();
  else if(t==='khac')veKhac();
  else if(t.startsWith('lop:'))veLop(t.slice(4));
  scrollTo({top:0,behavior:'smooth'});
}
function doiTheme(){
  const r=document.documentElement;
  const toi=r.getAttribute('data-theme')==='dark'||
    (!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
  r.setAttribute('data-theme',toi?'light':'dark');
  document.getElementById('nut-theme').textContent=toi?'Nền tối':'Nền sáng';
  moTrang(trangHT);
}
addEventListener('resize',()=>{ clearTimeout(window._t);
  window._t=setTimeout(()=>moTrang(trangHT),220); });

dungDieuHuong();
moTrang('tong');
</script>
